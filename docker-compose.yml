services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postsync
      POSTGRES_USER: postsync
      POSTGRES_PASSWORD: postsync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postsync -d postsync"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/postsync
      DB_USER: postsync
      DB_PASSWORD: postsync
    ports:
      - "8080:8080"

volumes:
  pgdata:
